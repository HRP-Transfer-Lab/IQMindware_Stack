name: Validate cognitive workflow ontology

on:
  push:
    paths:
      - "workflow-ontology/**"
      - ".github/workflows/validate-workflow-ontology.yml"
  pull_request:
    paths:
      - "workflow-ontology/**"
      - ".github/workflows/validate-workflow-ontology.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate ontology registries
        run: python workflow-ontology/scripts/validate_registry.py
