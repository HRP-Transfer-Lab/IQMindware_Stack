name: Validate cognitive workflow ontology

on:
  push:
    paths:
      - "workflow-ontology/**"
      - ".github/workflows/validate-workflow-ontology.yml"
  pull_request:
    paths:
      - "workflow-ontology/**"
      - ".github/workflows/validate-workflow-ontology.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate ontology registries
        run: python workflow-ontology/scripts/validate_registry.py

      - name: Validate website release candidate
        run: python workflow-ontology/website-release/scripts/validate_website_release.py

      - name: Execute website route and boundary cases
        run: python workflow-ontology/website-release/scripts/run_website_route_cases.py

      - name: Render reference route payload
        run: |
          python workflow-ontology/website-release/scripts/render_route_result.py \
            --route-id report_review_and_verification_v1 \
            --output /tmp/report-review-route.json
          python -m json.tool /tmp/report-review-route.json > /dev/null

      - name: Build checksummed website bundle
        run: |
          python workflow-ontology/website-release/scripts/build_website_release.py \
            --version 0.1.0-rc2 \
            --source-commit "$GITHUB_SHA" \
            --output /tmp/iqm-website-release
          test -f /tmp/iqm-website-release/release-manifest.json
          test -f /tmp/iqm-website-release/SHA256SUMS
          test -f /tmp/iqm-website-release/ontology-lock.generated.json
